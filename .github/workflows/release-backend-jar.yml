# Génère le jar du backend et l'attache à la release GitHub publiée.
# Build identique à backend/Dockerfile : la connexion BDD se configure au lancement
# via SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
name: Release - jar backend

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build du jar
        working-directory: backend
        run: ./mvnw -B clean package -DskipTests

      - name: Ajout du jar à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp backend/target/backend-*.jar "argentic-backend-${TAG}.jar"
          gh release upload "$TAG" "argentic-backend-${TAG}.jar" --clobber
