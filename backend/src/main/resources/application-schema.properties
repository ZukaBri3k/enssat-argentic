# Profil d'export du script SQL de création de la BDD (livrable).
# Usage (depuis backend/) : ./mvnw spring-boot:run -Dspring-boot.run.profiles=schema
# Aucune connexion MySQL n'est nécessaire : le schéma est déduit des entités JPA.

spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# Requis : sans accès JDBC, Hibernate ne peut pas détecter le dialecte seul
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=../docs/script_creation_bdd.sql
spring.jpa.properties.hibernate.hbm2ddl.schema-generation.script.append=false
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.format_sql=true
